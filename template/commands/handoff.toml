description = "Close a slice for the next session. Add `full` for the two reviews of the diff and the fresh-reader check."
prompt = """
Close this slice for the next session by following the procedure below, step by step. Say so for any step it marks planned.

The project to hand off is the current working directory. The workflow repository, where the procedure and its scripts (`scripts/close_slice.py`, which runs `scripts/vault_sync.py`, `scripts/stats_line.py` and `scripts/vault_lint.py`) live, is at `__WORKFLOW__`.

Arguments: {{args}}

Plain `/handoff` is the light close and never runs the checks. The argument `full` (or `check`) adds them: the two reviews of the diff and the fresh-reader test. Do not choose the mode yourself. In `full`, if a check cannot run, say which and why in the report; the close is then not complete.

The vault path comes from the arguments, else from the terms at the top of the project's `docs/HANDOFF.md`, else ask. Do not guess one.

Running this command is the owner's go-ahead to commit the slice's named files and push (ADR 005 amendment). Outside it, commit and push only when the owner says so.

!{cat "__WORKFLOW__/docs/sop/handoff.md"}

!{cat "__WORKFLOW__/docs/sop/handoff-gemini.md"}
