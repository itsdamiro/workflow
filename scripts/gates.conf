# One gate per line:  name | directory (from the repo root) | command
# A gate that cannot fail is not a gate. These cover the template code; the vault scripts add theirs when they exist.
hook-tests | .  | python3 -m unittest discover -s template/hooks
shell-syntax | . | bash -n template/adopt.sh && bash -n template/install.sh && bash -n scripts/gates
gates-test | . | bash template/scripts/test_gates.sh
