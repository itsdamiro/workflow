# One gate per line:  name | directory (from the repo root) | command
# A gate that cannot fail is not a gate. These cover the template code; the vault scripts add theirs when they exist.
hook-tests | .  | python3 -m unittest discover -s template/hooks
shell-syntax | . | bash -n template/adopt.sh && bash -n template/install.sh && bash -n scripts/gates && bash -n template/git-hooks/commit-msg
gates-test | . | bash template/scripts/test_gates.sh
context-report | . | python3 -m unittest discover -s adapters/claude/context-report
commit-msg-test | . | bash template/git-hooks/test_commit_msg.sh
adopt-test | . | bash template/test_adopt.sh
